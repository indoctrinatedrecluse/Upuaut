name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One release run per ref: a re-push cannot race another run over the same release asset.
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    # Bounds the whole release: without an explicit limit a stalled restore or asset
    # upload keeps the run "in progress" for GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Directory.Build.props is the single source of truth for the version metadata.
          $versionNodes = @(Select-Xml -LiteralPath 'Directory.Build.props' -XPath '/Project/PropertyGroup/Version' -ErrorAction Stop)
          if ($versionNodes.Count -eq 0) { throw 'Directory.Build.props must declare a Version property.' }
          $declared = $versionNodes[0].Node.InnerText.Trim()
          if ($declared -notmatch '^\d+\.\d+\.\d+$') { throw "Directory.Build.props must declare a MAJOR.MINOR.PATCH Version; found '$declared'." }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$env:GITHUB_REF_NAME' must use the vMAJOR.MINOR.PATCH release format." }
            if ($version -ne $declared) { throw "Tag '$env:GITHUB_REF_NAME' does not match Version '$declared' in Directory.Build.props. Bump the version metadata before tagging." }
          } else {
            $version = $declared
            Write-Host "Manual dispatch: using version $version from Directory.Build.props."
          }
          "UPUAUT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Validate release video assets
        shell: pwsh
        run: |
          $assets = @(
            'src/Upuaut.App/wwwroot/media/upuaut-background.mp4',
            'src/Upuaut.App/wwwroot/media/upuaut-splash-poster.jpg',
            'installer/assets/upuaut-installer-loop.mp4'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Required release asset is missing: $asset" }
            if ((Get-Item -LiteralPath $asset).Length -eq 0) { throw "Release asset is empty: $asset" }
          }

      - name: Publish Upuaut app
        timeout-minutes: 20
        run: dotnet publish src/Upuaut.App/Upuaut.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.UPUAUT_VERSION }} -o artifacts/payload

      - name: Publish installer
        timeout-minutes: 15
        run: dotnet publish installer/Upuaut.Setup/Upuaut.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.UPUAUT_VERSION }} -o artifacts/package

      - name: Assemble themed setup package
        shell: pwsh
        timeout-minutes: 10
        run: |
          $stage = Join-Path $PWD 'artifacts/package'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'payload'), (Join-Path $stage 'media') | Out-Null
          Copy-Item -Path 'artifacts/payload/*' -Destination (Join-Path $stage 'payload') -Recurse -Force
          Copy-Item -Path 'LICENSE' -Destination $stage -Force
          $installerVideo = 'installer/assets/upuaut-installer-loop.mp4'
          Copy-Item $installerVideo (Join-Path $stage 'media/upuaut-installer-loop.mp4') -Force
          $installerPoster = 'src/Upuaut.App/wwwroot/media/upuaut-splash-poster.jpg'
          if (Test-Path $installerPoster) {
            Copy-Item $installerPoster (Join-Path $stage 'media/upuaut-splash-poster.jpg') -Force
          }
          $archive = "artifacts/Upuaut-Setup-win-x64-v$env:UPUAUT_VERSION.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          "UPUAUT_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Prepare release notes from this version only
        shell: pwsh
        timeout-minutes: 5
        run: |
          $version = $env:UPUAUT_VERSION
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $marker = "## [$version]"
          $start = $changelog.IndexOf($marker, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version." }
          $section = $changelog.Substring($start)
          $next = [regex]::Match($section.Substring($marker.Length), '(?m)^## \[')
          if ($next.Success) { $section = $section.Substring(0, $marker.Length + $next.Index) }
          $notesPath = 'artifacts/release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $section.Trim() -Encoding utf8
          "UPUAUT_RELEASE_NOTES=$notesPath" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        uses: softprops/action-gh-release@v3
        with:
          name: Upuaut v${{ env.UPUAUT_VERSION }}
          body_path: ${{ env.UPUAUT_RELEASE_NOTES }}
          generate_release_notes: false
          files: ${{ env.UPUAUT_ARCHIVE }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        uses: actions/upload-artifact@v7
        with:
          name: Upuaut-Setup-win-x64-v${{ env.UPUAUT_VERSION }}
          path: ${{ env.UPUAUT_ARCHIVE }}
          if-no-files-found: error
