<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upuaut — Opener of the Ways</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet" />
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/Microsoft.FluentUI.AspNetCore.Components.bundle.scp.css" rel="stylesheet" />
    <link href="_content/Upuaut.UI/css/upuaut-theme.css" rel="stylesheet" />
    <link href="_content/Upuaut.UI/css/log-lab.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #090A0D; color: #D4AF37; font-family: sans-serif; flex-direction: column; gap: 1rem;">
            <div style="font-size: 2.5rem;">🐺</div>
            <div style="font-size: 1.1rem; letter-spacing: 0.15em; font-weight: 600;">UPUAUT INITIALIZING...</div>
        </div>
    </div>

    <script>
        window.upuautMotion = {
            getEnabled: () => localStorage.getItem("upuaut.motionBackground") !== "false",
            setEnabled: enabled => localStorage.setItem("upuaut.motionBackground", enabled ? "true" : "false")
        };
        window.upuautPreferences = {
            get: key => JSON.parse(localStorage.getItem(key) || "[]"),
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value))
        };
        window.addEventListener("keydown", event => {
            if (!event.ctrlKey || event.altKey || event.metaKey || (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable=true]"))) return;
            const routes = { "1": "chronicles", "2": "scout", "3": "weigher" };
            if (routes[event.key]) { event.preventDefault(); history.pushState(null, "", "/" + routes[event.key]); dispatchEvent(new PopStateEvent("popstate")); }
        });
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
